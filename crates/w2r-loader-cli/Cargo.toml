[package]
name = "w2r-loader-cli"
version = "1.3.0"
edition.workspace = true
rust-version.workspace = true
description = "w2r-loader: command-line interface of the W2R Mod Loader for Warcraft II Remastered"

[[bin]]
name = "w2r-loader"
path = "src/main.rs"

[dependencies]
w2r-loader-lib = { path = "../w2r-loader-lib" }
w2r-formats.workspace = true
w2r-replay.workspace = true
w2r-stats.workspace = true
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
w2r-loader-lib = { path = "../w2r-loader-lib", features = ["dev-repo"] }
