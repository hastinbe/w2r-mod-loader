[package]
name = "w2r-core"
version = "1.2.0-mx"
edition.workspace = true
rust-version.workspace = true
description = "In-game plugin host for Warcraft II Remastered (32-bit cdylib, version.dll proxy)"
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
w2r-abi.workspace = true
w2r-formats.workspace = true
w2r-preview.workspace = true
w2r-replay.workspace = true
w2r-stats.workspace = true
# DLL pins, peer tags and the simulation fingerprint.
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# Structured exception handling around every call into a plugin. See src/guard.rs for why.
microseh = "1.2"
# Inline hooks (bundled MinHook, BSD-2). See src/hooks.rs.
minhook-sys = "0.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Networking_WinHttp",
    "Win32_Globalization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
